name: Semgrep SAST
on:
  pull_request:
    branches: [main, master]
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:
    inputs:
      reason:
        description: "Reason for manual run"
        required: false
        default: "Manual security scan"

jobs:
  semgrep:
    name: Static analysis
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4

      - name: Run Semgrep
        run: |
          semgrep scan --config auto --error --json --output semgrep-results.json || true
          semgrep scan --config auto --error --sarif --output semgrep-results.sarif || true

      # - name: Upload SARIF to GitHub
      #   if: always()
      #   uses: github/codeql-action/upload-sarif@v3
      #   with:
      #     sarif_file: semgrep-results.sarif

      - name: Wrap results with repo metadata and send
        if: always()
        env:
          SAST_WEBHOOK_URL: ${{ secrets.SAST_WEBHOOK_URL }}
          SAST_WEBHOOK_TOKEN: ${{ secrets.SAST_WEBHOOK_TOKEN }}
        run: |
          python3 -c "
          import json, os
      
          repo_full = os.environ.get('GITHUB_REPOSITORY', 'unknown/unknown')
          parts = repo_full.split('/', 1)
          org = parts[0] if len(parts) > 1 else 'unknown'
          repo = parts[1] if len(parts) > 1 else repo_full
      
          ref = os.environ.get('GITHUB_REF', 'unknown')
          sha = os.environ.get('GITHUB_SHA', 'unknown')
          actor = os.environ.get('GITHUB_ACTOR', 'unknown')
          event = os.environ.get('GITHUB_EVENT_NAME', 'unknown')
          run_id = os.environ.get('GITHUB_RUN_ID', 'unknown')
          server = os.environ.get('GITHUB_SERVER_URL', 'https://github.com')
      
          try:
              with open('semgrep-results.json', 'r') as f:
                  semgrep = json.load(f)
          except Exception:
              semgrep = {'results': [], 'errors': [], 'version': 'unknown'}
      
          payload = {
              'tool': 'semgrep',
              'org': org,
              'repo': repo,
              'ref': ref,
              'sha': sha,
              'actor': actor,
              'event': event,
              'run_id': run_id,
              'repo_url': f'{server}/{repo_full}',
              'results': semgrep.get('results', []),
              'errors': semgrep.get('errors', []),
              'version': semgrep.get('version', 'unknown')
          }
      
          with open('semgrep-payload.json', 'w') as f:
              json.dump(payload, f)
      
          print(f'Wrapped {len(payload[\"results\"])} findings for {org}/{repo}')
          "
      
          BRANCH="${{ github.head_ref || github.ref_name }}"
          REPO_NAME="${{ github.event.repository.name }}"
      
          # Strip any accidental whitespace/newlines from secret
          CLEAN_URL=$(echo "$SAST_WEBHOOK_URL" | tr -d '[:space:]')
      
          curl -X POST "${CLEAN_URL}?branch=${BRANCH}&repo=${REPO_NAME}" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${SAST_WEBHOOK_TOKEN}" \
            -d @semgrep-payload.json

