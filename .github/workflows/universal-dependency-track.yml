name: Dependency Track SBOM Scan

# PORTABLE TEMPLATE — copy into
# <your-repo>/.github/workflows/universal-dependency-track.yml as-is;
# nothing repo-specific in it.
#
# DIVERGES from mapup-security-team/.github/workflows/universal-dependency-track.yml:
# adds Ruby gem installation, a second Trivy pass in rootfs mode, and a
# license-merge step, so gems no longer land in Dependency-Track with no
# license metadata. Do not re-copy the upstream template over this file
# without carrying those three changes across.
#
# Covers TWO of the org's tracked tools in one file: Trivy (generates the
# CycloneDX SBOM in license mode) and Dependency-Track (receives it).
#
# Required secret: DEPENDENCYTRACK_API_KEY

on:
  # No branch filters: repos differ in default-branch names. Pushes are
  # gated to the repo's actual default branch by the job-level `if` below
  # (GitHub trigger filters can't express "the default branch" dynamically);
  # PRs into any branch are scanned.
  push:
  pull_request:
  schedule:
    # Run daily at 9am UTC
    - cron: '0 9 * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  dependency-scan:
    # Only default-branch pushes produce the canonical 'main' SBOM upload —
    # feature-branch pushes are skipped rather than overwriting it.
    if: github.event_name != 'push' || github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js (if needed)
        if: hashFiles('**/package.json') != ''
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '18'

      - name: Setup Python (if needed)
        if: hashFiles('**/requirements.txt', '**/pyproject.toml', '**/setup.py') != ''
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.x'

      - name: Setup Go (if needed)
        if: hashFiles('**/go.mod') != ''
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: 'stable'

      - name: Setup Java (if needed)
        if: hashFiles('**/pom.xml', '**/build.gradle', '**/build.gradle.kts') != ''
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies (all languages, including monorepos)
        run: |
          echo "🔍 Detecting and installing dependencies..."

          # Install pnpm if any pnpm-lock.yaml exists (needed for mixed monorepos)
          if find . -name "pnpm-lock.yaml" -not -path "*/node_modules/*" | grep -q .; then
            echo "📦 Installing pnpm globally (detected pnpm projects)"
            npm install -g pnpm
          fi

          # Node.js: Check root first for workspace-level install
          if [ -f "pnpm-lock.yaml" ]; then
            echo "📦 Detected pnpm workspace at root"
            pnpm install --no-frozen-lockfile --ignore-scripts 2>/dev/null || echo "Note: pnpm install failed, continuing..."
          elif [ -f "yarn.lock" ]; then
            echo "📦 Detected yarn workspace at root"
            yarn install --ignore-scripts 2>/dev/null || echo "Note: yarn install failed, continuing..."
          elif [ -f "package-lock.json" ]; then
            echo "📦 Found npm project at root"
            npm ci 2>/dev/null || npm install 2>/dev/null || echo "Note: npm install failed, continuing..."
          elif [ -f "package.json" ]; then
            echo "📦 Found Node.js project at root (no lock file)"
            npm install --package-lock-only 2>/dev/null || echo "Note: npm install failed, continuing..."
          fi

          # Find all subdirectories and install based on their lock files (for mixed monorepos)
          find . -type d -not -path "*/node_modules/*" -not -path "*/.git/*" -not -path "." | while read -r dir; do
            if [ -f "$dir/pnpm-lock.yaml" ]; then
              echo "📦 Found pnpm project in: $dir"
              (cd "$dir" && pnpm install --no-frozen-lockfile --ignore-scripts 2>/dev/null || echo "Note: pnpm install failed in $dir")
            elif [ -f "$dir/yarn.lock" ]; then
              echo "📦 Found yarn project in: $dir"
              (cd "$dir" && yarn install --ignore-scripts 2>/dev/null || echo "Note: yarn install failed in $dir")
            elif [ -f "$dir/package-lock.json" ]; then
              echo "📦 Found npm project in: $dir"
              (cd "$dir" && (npm ci 2>/dev/null || npm install 2>/dev/null || echo "Note: npm install failed in $dir"))
            elif [ -f "$dir/package.json" ]; then
              echo "📦 Found Node.js project in: $dir (no lock file)"
              (cd "$dir" && npm install --package-lock-only 2>/dev/null || echo "Note: npm install failed in $dir")
            fi
          done

          # Python projects
          find . -name "requirements.txt" -not -path "*/.git/*" -not -path "*/venv/*" | while read -r req; do
            dir=$(dirname "$req")
            echo "🐍 Found Python project in: $dir"
            (cd "$dir" && pip install -r requirements.txt 2>/dev/null || echo "Note: pip install failed in $dir")
          done

          # Go projects
          find . -name "go.mod" -not -path "*/.git/*" | while read -r gomod; do
            dir=$(dirname "$gomod")
            echo "🔷 Found Go project in: $dir"
            (cd "$dir" && go mod download 2>/dev/null || echo "Note: go mod download failed in $dir")
          done

          # Java/Maven projects
          find . -name "pom.xml" -not -path "*/.git/*" | while read -r pom; do
            dir=$(dirname "$pom")
            echo "☕ Found Maven project in: $dir"
            (cd "$dir" && mvn dependency:resolve 2>/dev/null || echo "Note: mvn dependency:resolve failed in $dir")
          done

          # Java/Gradle projects
          find . -name "build.gradle*" -not -path "*/.git/*" | while read -r gradle; do
            dir=$(dirname "$gradle")
            echo "☕ Found Gradle project in: $dir"
            (cd "$dir" && (./gradlew dependencies 2>/dev/null || gradle dependencies 2>/dev/null || echo "Note: gradle dependencies failed in $dir"))
          done

          # Ruby projects: install the gems pinned in Gemfile.lock so Trivy can
          # read licenses from the installed .gemspec files — Gemfile.lock itself
          # carries no license metadata. Gems go to a local --install-dir, so this
          # needs no sudo and ignores the Gemfile's (often stale) `ruby` pin.
          find . -name "Gemfile.lock" -not -path "*/.git/*" -not -path "*/vendor/*" | while read -r lock; do
            dir=$(dirname "$lock")
            echo "💎 Found Ruby project in: $dir (ruby $(ruby -v 2>/dev/null || echo 'not installed'))"
            awk '/^  specs:/{f=1;next} /^$/{f=0} f && /^    [a-zA-Z]/{gsub(/[()]/,"");print $1":"$2}' "$lock" \
              | while read -r g; do
                  (cd "$dir" && gem install --no-document --install-dir vendor/bundle "$g" >/dev/null 2>&1) \
                    || echo "Note: gem install $g failed in $dir"
                done
          done

          echo "✅ Dependency installation complete"
        continue-on-error: true

      - name: Generate SBOM with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          format: cyclonedx
          output: bom-raw.json
          scanners: license
          license-full: true

      # Trivy's `fs` scan reads Gemfile.lock, which has no license fields. Its
      # gemspec analyzer — the one that does resolve gem licenses — only runs in
      # `rootfs` mode. `rootfs` alone is not a substitute: it derives npm packages
      # by walking node_modules instead of the lockfile, which loses the dependency
      # graph and invents components for nested test fixtures. So run it purely as
      # a license lookup table and merge it into the `fs` BOM below.
      - name: Generate license-lookup SBOM with Trivy (rootfs mode)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: rootfs
          format: cyclonedx
          output: bom-licenses.json
          scanners: license
          license-full: true

      - name: Merge licenses, clean and validate SBOM
        run: |
          echo "🔗 Merging licenses from the rootfs pass into the fs BOM..."
          echo "🧹 Cleaning SBOM (removing manifest/lock files and false positives)..."
          jq -n --slurpfile raw bom-raw.json --slurpfile lic bom-licenses.json '
            # Licenses the rootfs pass resolved, keyed by purl.
            ($lic[0].components // [] | map(select(.purl and .licenses)) | INDEX(.purl)) as $bypurl
            | $raw[0]
            # Fill in licenses only where the fs pass found none. Never adds a
            # component, so rootfs-only false positives cannot leak in.
            | .components |= map(
                if (.licenses | not) and .purl and $bypurl[.purl]
                then .licenses = $bypurl[.purl].licenses
                else . end)
            # Drop the scanned manifest/lock files themselves — they are the
            # files owned by this repo, not third-party components, and unlicensed.
            | .components |= map(select(
                (.type != "application") or
                (.name | test("(^|/)(package-lock\\.json|yarn\\.lock|pnpm-lock\\.yaml|go\\.mod|go\\.sum|uv\\.lock|poetry\\.lock|Pipfile\\.lock|Cargo\\.lock|composer\\.lock|Gemfile\\.lock|.*lock\\.json)$") | not)))
            # Prune dependency refs pointing at the components just removed,
            # so the BOM has no dangling bom-refs.
            | ([.components[]."bom-ref"] + [.metadata.component."bom-ref"] | map(select(. != null))) as $keep
            | .dependencies |= (map(select(.ref as $r | $keep | index($r)))
                                | map(.dependsOn |= ((. // []) | map(select(. as $d | $keep | index($d))))))
          ' > bom.json

          echo ""
          echo "📊 SBOM Statistics:"
          cat bom.json | jq '{
              totalComponents: (.components | length),
              componentsWithLicenses: ([.components[] | select(.licenses)] | length),
              componentsMissingLicenses: ([.components[] | select(.licenses | not) | .name])
          }'

      - name: Upload BOM to Dependency-Track
        uses: DependencyTrack/gh-upload-sbom@48feab3080ff9e8f51f4d21861d9fc914eb744f5 # v3.1.0
        with:
          serverhostname: 'deptrack-api.mapup.ai'
          port: '443'
          protocol: 'https'
          apikey: ${{ secrets.DEPENDENCYTRACK_API_KEY }}
          projectname: ${{ github.event.repository.name }}
          projectversion: 'main'
          bomfilename: 'bom.json'
          autocreate: 'true'

      - name: Archive SBOM artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: sbom-cyclonedx
          path: bom.json
          retention-days: 90
